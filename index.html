<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>PokeApi - Pokémon Team Builder</title>
</head>
<body>
    <div class="opacity">
        <!-- Random Pokémon Section -->
        <div class="container">
            <div class="container-center">
                <h1>PokeApi</h1>
                <section id="img-name"></section>
                <div class="button">
                    <button type="button" onclick="Pokemonrandom()">Random Pokémon</button>
                </div>
                <section class="stats-pokemon">
                    <p id="namepokemon"></p>
                    <ul id="stats-list"></ul>
                </section>
            </div>
        </div>

        <!-- Team Builder Section -->
        <div class="container form">
            <h2 id="TitleTeam">Pokémon Team</h2>
            <div class="formpokemon">
                <h3>Build Your Team</h3> 
                <input 
                    type="text" 
                    placeholder="Enter Pokémon name or ID" 
                    id="pokemonInput"
                    aria-label="Pokémon name or ID"
                >
                <div class="button-container">
                    <button type="button" onclick="EquipoPokemon()">Add to Team</button>
                </div>
            </div>
        </div>
        
        <!-- Team Cards Container -->
        <section class="container-cards" aria-label="Pokémon team cards"></section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
